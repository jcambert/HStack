name: ci

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      windows_validation:
        description: 'Also run the Windows compile/unit-test job'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-m8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HermesStack.slnx
      - name: Build
        run: dotnet build HermesStack.slnx --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/HermesStack.UnitTests/HermesStack.UnitTests.csproj --no-build -c Release
      - name: Integration tests
        run: dotnet test tests/HermesStack.IntegrationTests/HermesStack.IntegrationTests.csproj --no-build -c Release
      - name: M3 Sessions regression gate
        run: bash tests/e2e/m3-smoke.sh
      - name: M4 Network & Security regression gate
        run: bash tests/e2e/m4-smoke.sh
      - name: M5 Token Efficiency regression gate
        run: bash tests/e2e/m5-smoke.sh
      - name: M6 Shared Context end-to-end gate
        run: bash tests/e2e/m6-smoke.sh
      - name: M7 Operations regression gate
        run: bash tests/e2e/m7-update-check-smoke.sh
      - name: Install pinned Aspire CLI
        run: dotnet tool install Aspire.Cli --version 13.6.0 --tool-path .tools
      - name: M8 Aspire Experience end-to-end gate
        run: |
          export PATH="$PWD/.tools:$PATH"
          bash tests/e2e/m8-smoke.sh

  windows-compile:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_validation }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore HermesStack.slnx
      - run: dotnet build HermesStack.slnx --no-restore -c Release
      - run: dotnet test tests/HermesStack.UnitTests/HermesStack.UnitTests.csproj --no-build -c Release

  publish-artifacts:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - linux-m8
      - windows-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - linux-x64
          - linux-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish hstack
        run: >
          dotnet publish src/HermesStack.Cli/HermesStack.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/${{ matrix.rid }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd "artifacts/${{ matrix.rid }}" && zip -qr "../../dist/hstack-${{ matrix.rid }}.zip" .)
          else
            tar -C "artifacts/${{ matrix.rid }}" -czf "dist/hstack-${{ matrix.rid }}.tar.gz" .
          fi
          (cd dist && sha256sum * > "hstack-${{ matrix.rid }}.sha256")
      - name: Upload delivery artifact
        uses: actions/upload-artifact@v7
        with:
          name: hstack-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
